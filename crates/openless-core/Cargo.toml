[package]
name = "openless-core"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Framework-independent OpenLess application core"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# 相邻近似重复检测：NFKC 归一化（unicode-normalization）。
unicode-normalization = "0.1"
# `rt`/`macros` are needed by the injected Tokio spawner and the core's
# asynchronous contract tests.  The core still does not own a runtime: hosts
# may provide another `TaskSpawner` implementation when they need a different
# executor.
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
