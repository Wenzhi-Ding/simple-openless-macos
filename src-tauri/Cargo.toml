[package]
name = "openless"
version = "2.0.1"
license = "AGPL-3.0-only"
description = "OpenLess — local voice input that types where your cursor is"
authors = ["OpenLess"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "openless_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compile vendored Open-Less/qwen-asr C sources for the local ASR engine on macOS.
cc = "1.1"

[dependencies]
# Framework-independent business core.  Tauri remains an adapter and owns the
# window/plugin/IPC concerns; Linux must depend on the same crate directly.
openless-core = { path = "../crates/openless-core" }
llama-cpp-2 = { version = "0.1.156", default-features = false, features = ["metal"] }
encoding_rs = "0.8"
# 锁 ~2.11 因为 npm @tauri-apps/api 与 plugin-dialog 都已升 2.11；
# tauri build 跨 minor 一致性检查会拒绝 npm 2.11 + Rust 2.10 的组合。
# macos-private-api must live in [dependencies] so tauri_build can match tauri.conf.json
# macOSPrivateApi; tray-icon stays desktop-only in the target table below.
tauri = { version = "~2.11", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 热词同音纠错:汉字转拼音(my_typeless Python 版的 Rust 移植)。
pinyin = "0.10"
# 历史录音回放 data URL(read_audio_recording)用的标准 base64。
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
thiserror = "1"
anyhow = "1"
log = "0.4"
simplelog = "0.12"
parking_lot = "0.12"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# Audio capture.
cpal = "0.15"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
global-hotkey = "0.6"
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5"
core-foundation = "0.10"
core-graphics = "0.24"
# issue #470：托盘麦克风设备变更改用 CoreAudio AudioObjectAddPropertyListener 原生通知
# （替代 10s 轮询，空闲零唤醒）。符号本就在依赖树（cpal → coreaudio-sys 0.2），提升为
# 直接依赖零额外编译成本。
coreaudio-sys = "0.2"
objc2 = { version = "0.5", features = ["exception"] }
# 屏幕 OCR（听写触发的本地 Vision 识别）： objc2 只用 msg_send/class 手写桥接
# （与 selection.rs 同模式），数组/字符串经 core-foundation toll-free bridging；
# foreign-types 提供 CGImage::as_ptr。
foreign-types = "0.5"

tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
window-vibrancy = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 之前没有 [profile.release] —— 发布版走 Cargo 默认（无 LTO、不 strip、
# codegen-units=16）。这个体量的 Tauri 应用（tokio-full / reqwest / axum /
# sherpa-onnx / windows crate 全家桶）开 LTO + codegen-units=1 + strip 能
# 明显减小二进制体积并提升运行速度。保留默认 panic="unwind"：后台线程 panic
# 时只杀该线程、不 abort 掉常驻进程，稳健性与改动前一致。
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
